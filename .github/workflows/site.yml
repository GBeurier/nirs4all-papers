name: Site (GitHub Pages)

# Build the reproduction-document site from papers/*/ and deploy it to papers.nirs4all.org.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - "assets/brand/**"
      - "papers/**"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install the publisher
        run: python -m pip install --upgrade pip .
      - name: Build the reproduction-document site
        run: n4a-papers build . --out site
      - name: Pages chrome (custom domain + Jekyll off)
        run: |
          echo "papers.nirs4all.org" > site/CNAME
          touch site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
