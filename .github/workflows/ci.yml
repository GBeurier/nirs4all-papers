name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Checkout nirs4all-repository handoff provider
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: GBeurier/nirs4all-repository
          path: external/nirs4all-repository
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install (with dev extras)
        run: python -m pip install --upgrade pip ".[dev]" pytest-cov
      - name: Install repository handoff provider
        run: python -m pip install -e external/nirs4all-repository
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy src/nirs4all_papers
      - name: Tests (with coverage)
        env:
          NIRS4ALL_REPOSITORY_ROOT: ${{ github.workspace }}/external/nirs4all-repository
        run: pytest -q --cov=nirs4all_papers --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
      - name: Build the demo site
        run: n4a-papers build . --out site
      - name: Validate emitted sidecars (CFF as YAML, RO-Crate as JSON)
        run: |
          python - <<'PY'
          import json, glob
          import yaml
          for p in glob.glob("site/paper/*/CITATION.cff"):
              yaml.safe_load(open(p, encoding="utf-8"))
          for p in glob.glob("site/paper/*/ro-crate-metadata.json"):
              d = json.load(open(p, encoding="utf-8"))
              assert "@graph" in d, p
          print("sidecars OK")
          PY
