name: Content Check

on:
  push:
  pull_request:

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check required public-repo docs
        run: |
          test -f README.md
          test -f papers/README.md
          test -f templates/reproducibility-kit/README.md
